<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elimu Analytics</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  table { border-collapse: collapse; margin-top: 1rem; }
  th, td { border: 1px solid #999; padding: .4rem .8rem; text-align: left; }
  button { margin: 0 .5rem .5rem 0; padding: .4rem .8rem; }
  .note { color: #555; font-size: .9rem; }
  .bar { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #ccc; }
  pre { background: #f4f4f4; padding: .8rem; overflow-x: auto; font-size: .85rem; }
</style>
</head>
<body>
<h1>Elimu Analytics</h1>
<p class="note">Phase 2. PostgreSQL persistence, real 2-PL calibration.</p>

<p id="strand" class="note">loading...</p>
<div id="buttons"></div>
<div id="result"></div>

<div class="bar">
  <button onclick="post('calibrate')">Calibrate strand</button>
  <button onclick="post('assess')">Run assessment</button>
  <button onclick="showFlags()">Intervention queue</button>
  <p class="note">Assessment records an ability estimate per learner. A learner is
     flagged only after two consecutive below-threshold assessments, so the first
     run raises nothing.</p>
  <pre id="ops"></pre>
</div>

<script>
let STRAND_ID = null;

async function api(path, method = "GET") {
  const r = await fetch(path, { method });
  if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
  return r.json();
}

async function show(id) {
  const d = await api(`/api/diagnose/${id}`);
  document.getElementById("result").innerHTML = `
    <table>
      <tr><th>Learner</th><td>${d.learner}</td></tr>
      <tr><th>Strand</th><td>${d.sub_strand}</td></tr>
      <tr><th>Items answered</th><td>${d.answered}</td></tr>
      <tr><th>Ability (theta)</th><td>${d.theta === null ? "not shown" : d.theta}</td></tr>
      <tr><th>KICD tier</th><td>${d.tier === null ? "not shown" : d.tier}</td></tr>
      <tr><th>Confident</th><td>${d.confident}</td></tr>
      <tr><th>Flaggable</th><td>${d.flaggable}</td></tr>
    </table>
    <p class="note">${d.message}</p>`;
}

async function post(action) {
  const out = document.getElementById("ops");
  out.textContent = "working...";
  try {
    out.textContent = JSON.stringify(
      await api(`/api/strands/${STRAND_ID}/${action}`, "POST"), null, 2);
  } catch (e) { out.textContent = "Error: " + e.message; }
}

async function showFlags() {
  const out = document.getElementById("ops");
  const flags = await api("/api/flags");
  out.textContent = flags.length
    ? JSON.stringify(flags, null, 2)
    : "No open flags. Run assessment twice - one below-threshold result is not enough.";
}

(async () => {
  try {
    const h = await api("/api/health");
    STRAND_ID = h.strands.length ? h.strands[0].id : null;
    document.getElementById("strand").textContent =
      `${h.strand || "no strand"} - ${h.students} learners - database ${h.database}`;
    const learners = await api("/api/learners");
    document.getElementById("buttons").innerHTML = learners
      .map(l => `<button onclick="show('${l.id}')">${l.name}</button>`).join("");
    if (learners.length) show(learners[0].id);
  } catch (e) {
    document.getElementById("strand").textContent =
      "Cannot reach the API: " + e.message;
  }
})();
</script>
</body>
</html>
