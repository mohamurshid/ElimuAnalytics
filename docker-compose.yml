services:
  db:
    image: pgvector/pgvector:pg16
    container_name: elimu-postgres
    environment:
      POSTGRES_USER: elimu
      POSTGRES_PASSWORD: elimu
      POSTGRES_DB: elimu
    ports:
      - "5432:5432"
    volumes:
      - elimu_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elimu -d elimu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  elimu_pgdata:
